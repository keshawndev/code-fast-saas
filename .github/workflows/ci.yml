name: CI

on:
  pull_request:
    branches: [dev, staging, prod]
  push:
    branches: [dev, staging, prod]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

  build:
    name: Docker build
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: code-fast-saas:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name app -p 3000:3000 code-fast-saas:ci
          curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://localhost:3000/api/health

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: code-fast-saas:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.4

      - name: Check formatting
        run: terraform fmt -check -recursive infra

      - name: Validate configuration
        run: |
          for dir in infra/bootstrap infra/envs/*; do
            echo "::group::$dir"
            terraform -chdir=$dir init -input=false -backend=false
            terraform -chdir=$dir validate
            echo "::endgroup::"
          done

  deploy:
    name: Deploy
    if: github.event_name == 'push'
    needs: [build, terraform]
    runs-on: ubuntu-24.04
    environment: ${{ github.ref_name }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check if image already exists
        id: image
        run: |
          if aws ecr describe-images --repository-name code-fast-saas --image-ids imageTag=$TAG > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/code-fast-saas:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Terraform apply
        working-directory: infra/envs/${{ github.ref_name }}
        env:
          TF_VAR_image_tag: ${{ env.TAG }}
          TF_VAR_stripe_price_id: ${{ vars.STRIPE_PRICE_ID }}
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve

      - name: Wait for service and check health
        working-directory: infra/envs/${{ github.ref_name }}
        run: |
          aws ecs wait services-stable --cluster code-fast-saas-${{ github.ref_name }} --services app
          URL=$(terraform output -raw app_url)
          curl --fail --retry 10 --retry-all-errors --retry-delay 5 "$URL/api/health"

      # A second tag, prod-<sha>, that the ECR lifecycle policy never expires
      # while the image is among the 5 most recent prod releases
      - name: Protect the prod image from cleanup
        if: github.ref_name == 'prod'
        run: |
          if aws ecr describe-images --repository-name code-fast-saas --image-ids imageTag=prod-$TAG > /dev/null 2>&1; then
            echo "prod-$TAG already exists"
            exit 0
          fi
          aws ecr batch-get-image --repository-name code-fast-saas --image-ids imageTag=$TAG --output json > image.json
          aws ecr put-image --repository-name code-fast-saas --image-tag "prod-$TAG" \
            --image-manifest "$(jq -r '.images[0].imageManifest' image.json)" \
            --image-manifest-media-type "$(jq -r '.images[0].imageManifestMediaType' image.json)"
